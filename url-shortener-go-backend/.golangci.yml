run:
  timeout: 5m
  tests: true

linters:
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gosec
    - govet
    - misspell
    - noctx
    - prealloc
    - revive
    - staticcheck
    - unparam

linters-settings:
  gosec:
    excludes:
      - G114

  revive:
    rules:
      - name: exported
        disabled: true
      - name: unused-parameter
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - gocritic