name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: url-shortener-go-backend/go.mod
          cache-dependency-path: url-shortener-go-backend/go.sum

      # Install lint tool explicitly (more stable than relying on action defaults)
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s v1.64.8
          sudo mv ./bin/golangci-lint /usr/local/bin/golangci-lint

      - name: Verify golangci-lint config
        run: |
          cd url-shortener-go-backend
          golangci-lint config verify

      - name: Run linter
        run: |
          cd url-shortener-go-backend
          golangci-lint run ./... --timeout=5m

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: lint-backend

    defaults:
      run:
        working-directory: url-shortener-go-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go build ./cmd/server

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: url-shortener-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: url-shortener-frontend/package-lock.json

      - run: npm ci
      - run: npm run lint

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend

    defaults:
      run:
        working-directory: url-shortener-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: url-shortener-frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}